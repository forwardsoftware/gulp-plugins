# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: monthly

  # pnpm workspace: Dependabot resolves `plugins/*` packages and the root `catalog:`
  # from the root `pnpm-workspace.yaml`, so only the root directory must be listed.
  # Listing workspace packages too creates duplicate PRs that conflict on the shared lockfile.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
    commit-message:
      include: scope
      prefix: "fix"
      prefix-development: "chore"
    groups:
      babel:
        patterns:
          - "@babel/*"
      rollup:
        patterns:
          - "rollup"
          - "@rollup/*"
